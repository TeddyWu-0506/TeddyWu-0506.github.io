name: build and publish

# Pages for a username.github.io repo is locked to the legacy branch source, so a
# workflow cannot hand GitHub an artifact. Instead: author on src, and this job
# builds dist/ and pushes it to main, which is the branch Pages serves.
# Never edit main by hand - it is generated.
on:
  push:
    branches: [src]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # build.py stamps sitemap <lastmod> from `git log`; a shallow checkout
          # would make every unchanged page answer with nothing.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Enforce the fact single-source invariants
        run: |
          # pypdf is pure Python and only used to read the resume's text layer, so the CV
          # cannot drift away from the site's numbers unnoticed.
          python -m pip install --quiet pypdf
          python tools/build.py
          python tools/build.py --check

      - name: Build the offline single-file bundle
        run: python tools/bundle.py

      - name: Publish dist to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git clone --quiet --branch main --single-branch \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
          rsync -a --delete --exclude '.git' dist/ deploy/
          cd deploy
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed; skipping publish."
            exit 0
          fi
          git commit -m "build: publish ${GITHUB_SHA}"
          git push origin HEAD:main
